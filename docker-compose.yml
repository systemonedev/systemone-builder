# systemone-builder stack (2x RTX 3090). Runs on native Linux or on Docker
# Desktop / WSL2. Memory limits, ports and offload sizes are all overridable
# from .env - see .env.example.
name: systemone

x-s1-env: &s1-env
  # Redis requires a password; the value comes from .env (S1_REDIS_PASSWORD).
  S1_REDIS_URL: redis://:${S1_REDIS_PASSWORD:?set S1_REDIS_PASSWORD in .env (openssl rand -hex 24)}@redis:6379/0
  S1_DATA_DIR: /data
  # Named volume (fast native disk, incl. WSL2/Docker Desktop) or an absolute
  # host path. The orchestrator mounts the same source into the trainer.
  S1_WORKSPACE_HOST_PATH: ${S1_WORKSPACE_VOLUME:-systemone-workspace}
  S1_STUDENT_URL: http://student:8000/v1
  S1_TRIAGE_URL: http://triage:8000/v1

services:
  # ------------------------------------------------------------ RAM datastore
  redis:
    image: redis:7.4
    container_name: systemone-redis
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${S1_REDIS_PASSWORD:?set S1_REDIS_PASSWORD in .env (openssl rand -hex 24)}
    environment:
      # lets the healthcheck's redis-cli authenticate without the password on argv
      REDISCLI_AUTH: ${S1_REDIS_PASSWORD}
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"   # host-local only; containers use the compose network
    mem_limit: ${S1_REDIS_MEM_LIMIT:-40g}
    ulimits:
      nofile: 65535
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: "no"

  # ------------------------------------------------- orchestrator + LAN API
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: systemone/api:latest
    container_name: systemone-api
    env_file: [{ path: .env, required: false }]
    environment:
      <<: *s1-env
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
      # The API refuses to start on a non-loopback bind without a real S1_API_KEY.
      S1_BIND_ADDR: ${S1_BIND_ADDR:-127.0.0.1}
      S1_PUBLIC_API_PORT: ${S1_API_PORT:-8090}
    # The Docker socket lets the orchestrator stop/start the student and launch
    # the trainer. It is root-equivalent on the Docker VM: keep S1_API_KEY set
    # and the API bound to 127.0.0.1 unless you need LAN access.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${S1_WORKSPACE_VOLUME:-systemone-workspace}:/data/workspace
      - ./var/eval_results:/data/eval_results
      - ./var/domains:/data/domains
    ports:
      - "${S1_BIND_ADDR:-127.0.0.1}:${S1_API_PORT:-8090}:8000"
    mem_limit: ${S1_API_MEM_LIMIT:-4g}
    depends_on:
      redis: { condition: service_healthy }
      student: { condition: service_healthy }
      # started, not healthy: the triage wait keeps model loads sequential, but
      # a failing triage must not keep the API/dashboard (and its status
      # panel) from coming up.
      triage: { condition: service_started }
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
    restart: "no"

  # ------------------------------------------ Zero-to-One Quickstart (one-shot)
  # Loads the dummy web-automation dataset, runs the first strict
  # train -> hot-reload cycle on the tiny 1.5B student and benchmarks it.
  # Idempotent: on later `docker compose up` runs it detects the loaded
  # dataset / finished run and exits. Disable with S1_QUICKSTART=0.
  quickstart:
    image: systemone/api:latest
    container_name: systemone-quickstart
    env_file: [{ path: .env, required: false }]
    environment:
      S1_API: http://api:8000
      S1_PUBLIC_HOST: ${S1_PUBLIC_HOST:-localhost}
      S1_PUBLIC_API_PORT: ${S1_API_PORT:-8090}
      S1_PUBLIC_DASHBOARD_PORT: ${S1_DASHBOARD_PORT:-3090}
      S1_QUICKSTART: ${S1_QUICKSTART:-1}
    entrypoint: ["sh", "-c", "[ \"$$S1_QUICKSTART\" = \"0\" ] && echo 'quickstart disabled' || exec systemone quickstart"]
    depends_on:
      api: { condition: service_healthy }
    restart: "no"

  # ----------------------------------------------- unified web dashboard
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: systemone/dashboard:latest
    container_name: systemone-dashboard
    # The browser only talks to the dashboard. Its gateway (frontend/gateway.mjs)
    # forwards /api/v1 to the API over the compose network and adds S1_API_KEY
    # itself, so the key never reaches the browser. Only same-origin requests
    # are forwarded. On loopback (the default) no sign-in is needed; on any
    # other S1_BIND_ADDR the dashboard asks for S1_API_KEY once and keeps an
    # HttpOnly session cookie. Only these variables are passed, not all of .env.
    environment:
      S1_API_KEY: ${S1_API_KEY:-}
      S1_API_INTERNAL_URL: http://api:8000
      S1_BIND_ADDR: ${S1_BIND_ADDR:-127.0.0.1}
      # extra host names the dashboard may be opened by on loopback, comma-separated
      S1_DASHBOARD_ALLOWED_HOSTS: ${S1_DASHBOARD_ALLOWED_HOSTS:-}
      S1_PUBLIC_HOST: ${S1_PUBLIC_HOST:-}
    ports:
      - "${S1_BIND_ADDR:-127.0.0.1}:${S1_DASHBOARD_PORT:-3090}:3000"
    mem_limit: ${S1_DASHBOARD_MEM_LIMIT:-1g}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      retries: 5
    restart: "no"

  # ------------------------------------------ GPU 0: Container B (student)
  student:
    build:
      context: .
      dockerfile: docker/student/Dockerfile
      args:
        VLLM_IMAGE: vllm/vllm-openai:${S1_VLLM_VERSION:-latest}
    image: systemone/student:latest
    container_name: systemone-student
    env_file: [{ path: .env, required: false }]
    environment:
      S1_STUDENT_BASE_MODEL: ${S1_STUDENT_BASE_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      # GPU selection follows the mindoril stacks that run stably on this
      # machine: device_ids + NVIDIA_VISIBLE_DEVICES + CUDA_VISIBLE_DEVICES, all
      # the same index. Docker Desktop (WSL2) exposes every GPU, so
      # CUDA_VISIBLE_DEVICES does the real pinning. On native Linux only the
      # reserved GPU is visible: set S1_STUDENT_CUDA_DEVICE=0 there.
      NVIDIA_VISIBLE_DEVICES: ${S1_STUDENT_GPU:-0}
      CUDA_VISIBLE_DEVICES: ${S1_STUDENT_CUDA_DEVICE:-${S1_STUDENT_GPU:-0}}
      S1_GPU_INDEX: ${S1_STUDENT_GPU:-0}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # empty = launcher default (32 GB on Linux, 0 on WSL2)
      S1_KV_OFFLOAD_GB: ${S1_KV_OFFLOAD_GB:-}
      # 1 = --enforce-eager; unset = off. Under WSL2 pinned memory is always off.
      S1_VLLM_SAFE_MODE: ${S1_STUDENT_SAFE_MODE:-}
      HF_HOME: /workspace/hf_cache
      VLLM_CACHE_ROOT: /workspace/vllm_cache
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${S1_WORKSPACE_VOLUME:-systemone-workspace}:/workspace
    ports:
      - "127.0.0.1:${S1_STUDENT_PORT:-8091}:8000"   # raw vLLM, no auth: host-local only
    # No ipc: host and no mem_limit, as in the mindoril vLLM services.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${S1_STUDENT_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 900s
      retries: 30
    # The lifecycle orchestrator stops/starts this container around training;
    # never let Docker restart it behind the orchestrator's back.
    restart: "no"

  # -------------------------------- GPU 0: the local System One model
  # Non-generative cross-encoder answering the Jev contract (state + typed
  # questions -> calibrated answers) at POST /v1/systemone. S1_SYSTEM_ONE_MODEL
  # is a trained model directory in the workspace volume, or a Hugging Face
  # cross-encoder for zero-shot use (the default). Needs ~2 GB of VRAM.
  s1:
    build:
      context: .
      dockerfile: docker/s1/Dockerfile
    image: systemone/s1:latest
    container_name: systemone-s1
    environment:
      S1_MODEL: ${S1_SYSTEM_ONE_MODEL:-MoritzLaurer/ModernBERT-large-zeroshot-v2.0}
      HF_HOME: /workspace/hf_cache
      HF_TOKEN: ${HF_TOKEN:-}
      NVIDIA_VISIBLE_DEVICES: ${S1_SYSTEM_ONE_GPU:-0}
      CUDA_VISIBLE_DEVICES: ${S1_SYSTEM_ONE_CUDA_DEVICE:-${S1_SYSTEM_ONE_GPU:-0}}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    volumes:
      - ${S1_WORKSPACE_VOLUME:-systemone-workspace}:/workspace
    ports:
      - "127.0.0.1:${S1_SYSTEM_ONE_PORT:-8093}:8000"   # no auth: host-local only
    mem_limit: ${S1_SYSTEM_ONE_MEM_LIMIT:-8g}
    stop_signal: SIGTERM
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${S1_SYSTEM_ONE_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 600s
      retries: 30
    restart: "no"

  # ------------------------------------------ GPU 1: Container C (triage)
  # Starts only after the student is healthy, so two engines never load
  # weights and allocate memory at the same time.
  triage:
    image: systemone/student:latest   # same vLLM launcher, triage role
    container_name: systemone-triage
    env_file: [{ path: .env, required: false }]
    environment:
      S1_VLLM_ROLE: triage
      NVIDIA_VISIBLE_DEVICES: ${S1_TRIAGE_GPU:-1}
      # native Linux: set S1_TRIAGE_CUDA_DEVICE=0 (see the student's note)
      CUDA_VISIBLE_DEVICES: ${S1_TRIAGE_CUDA_DEVICE:-${S1_TRIAGE_GPU:-1}}
      S1_GPU_INDEX: ${S1_TRIAGE_GPU:-1}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      S1_TRIAGE_MODEL: ${S1_TRIAGE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      S1_GPU_MEMORY_UTILIZATION: ${S1_TRIAGE_GPU_MEMORY_UTILIZATION:-0.90}
      S1_MAX_MODEL_LEN: ${S1_TRIAGE_MAX_MODEL_LEN:-16384}
      S1_KV_OFFLOAD_GB: ${S1_TRIAGE_KV_OFFLOAD_GB:-}
      S1_VLLM_EXTRA_ARGS: ${S1_TRIAGE_VLLM_EXTRA_ARGS:-}
      # 1 = --enforce-eager; unset = off (mindoril runs without it)
      S1_VLLM_SAFE_MODE: ${S1_TRIAGE_SAFE_MODE:-}
      # launcher defaults for triage match mindoril: --dtype half,
      # --max-num-seqs 3, --enable-chunked-prefill
      S1_MAX_NUM_SEQS: ${S1_TRIAGE_MAX_NUM_SEQS:-}
      HF_HOME: /workspace/hf_cache
      VLLM_CACHE_ROOT: /workspace/vllm_cache
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      student: { condition: service_healthy }
    volumes:
      - ${S1_WORKSPACE_VOLUME:-systemone-workspace}:/workspace
    ports:
      - "127.0.0.1:${S1_TRIAGE_PORT:-8092}:8000"    # raw vLLM, no auth: host-local only
    # No ipc: host and no mem_limit, as in the mindoril vLLM services.
    stop_signal: SIGTERM
    stop_grace_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${S1_TRIAGE_GPU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      start_period: 900s
      retries: 60
    restart: "no"

  # ------------------------------------------ GPU 0: Container A (trainer)
  # Built by `docker compose up` so the image exists, then exits at once.
  # The lifecycle orchestrator launches the real one-shot training container
  # (name: systemone-trainer) through the Docker Engine API, only after the
  # student has been stopped and GPU 0 VRAM verified empty.
  trainer:
    build:
      context: .
      dockerfile: docker/trainer/Dockerfile
    image: systemone/trainer:latest
    container_name: systemone-trainer-image
    entrypoint: ["python", "-c", "print('trainer image ready')"]
    restart: "no"

volumes:
  redis_data:
  # Models, HF cache, datasets, training runs. Lives on Docker's native disk
  # so safetensors load at full speed. Inspect with:
  #   docker run --rm -it -v systemone-workspace:/workspace alpine sh
  systemone-workspace:
    name: systemone-workspace
