# systemone-builder RAM datastore (Linux host, 120GB system RAM)
#
# RAM budget (see docs/hardware.md):
#   64 GB  Redis  - replay buffer, synthetic/DPO queues, telemetry
#   32 GB  vLLM student (GPU 0)  CPU KV-cache swap/offload
#   16 GB  vLLM triage  (GPU 1)  CPU KV-cache swap/offload
#   ~8 GB  OS, Docker, API, trainer dataloaders
bind 0.0.0.0
protected-mode no
port 6379
maxmemory 64gb
# Replay data is bounded by the buffer itself; never evict silently.
maxmemory-policy noeviction
io-threads 4
io-threads-do-reads yes
# Snapshot so a host reboot does not wipe the replay/DPO queues.
save 900 1
save 300 1000
appendonly yes
appendfsync everysec
dir /data
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
