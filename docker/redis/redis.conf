# systemone-builder RAM datastore
#
# RAM budget - sized for WSL2 / Docker Desktop with a 160 GB VM cap that also has
# to leave headroom for Windows. Raise maxmemory on a dedicated Linux host
# (previously 64 GB on a 120 GB box). Keep compose's redis mem_limit above it.
#   32 GB  Redis  - replay buffer, synthetic/DPO queues, telemetry
#   32 GB  vLLM student (GPU 0)  CPU KV-cache offload (0 by default on WSL2)
#   16 GB  vLLM triage  (GPU 1)  CPU KV-cache offload (0 by default on WSL2)
#   ~8 GB  OS, Docker, API, trainer dataloaders
#
# bind stays 0.0.0.0 because other containers connect over the compose network;
# exposure to the host is controlled by the ports mapping in docker-compose.yml.
# Authentication is mandatory: requirepass is passed on the command line from
# S1_REDIS_PASSWORD, so protected-mode is left on as a second guard.
bind 0.0.0.0
protected-mode yes
port 6379
maxmemory 32gb
# Replay data is bounded by the buffer itself; never evict silently.
maxmemory-policy noeviction
io-threads 4
io-threads-do-reads yes
# Snapshot so a host reboot does not wipe the replay/DPO queues.
save 900 1
save 300 1000
appendonly yes
appendfsync everysec
dir /data
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
