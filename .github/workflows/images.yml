name: images

# Builds the default stack's images and publishes them to GitHub Container Registry:
#   ghcr.io/systemonedev/systemone-api, systemone-dashboard, systemone-kenning
# main -> :main and :sha-<short>; a vX.Y.Z tag -> :X.Y.Z, :X.Y and :latest.
#
# No secrets go into an image: builds take no build arguments or secrets, CI checks out only
# committed files, and every image is scanned for credential files and key patterns before it
# is pushed. The only credential used is this run's GITHUB_TOKEN, for the registry login.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - backend/**
      - frontend/**
      - docker/api/**
      - docker/dashboard/**
      - docker/kenning/**
      - .dockerignore
      - .github/scan-image.sh
      - .github/workflows/images.yml
  pull_request:              # build and scan only; nothing is pushed from a PR
    paths:
      - docker/api/**
      - docker/dashboard/**
      - docker/kenning/**
      - .dockerignore
      - .github/scan-image.sh
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push to ghcr.io/systemonedev
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: systemone-api
            dockerfile: docker/api/Dockerfile
            description: SystemOne Builder API and orchestrator
          - name: systemone-dashboard
            dockerfile: docker/dashboard/Dockerfile
            description: SystemOne Builder dashboard and gateway
          - name: systemone-kenning
            dockerfile: docker/kenning/Dockerfile
            description: Kenning System One model server and trainer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space (the Kenning image is ~12 GB)
        if: matrix.name == 'systemone-kenning'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/systemonedev/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=systemonedev

      - name: Build (local, for the scan)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: scan/${{ matrix.name }}:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the image for credentials
        run: bash .github/scan-image.sh scan/${{ matrix.name }}:ci

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
