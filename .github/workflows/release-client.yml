name: release-client

# Publishes the systemone package to PyPI when a maintainer pushes a tag like client-v0.1.0.
# Uses PyPI Trusted Publishing (OIDC): no token is stored anywhere. One-time setup on pypi.org:
# a (pending) trusted publisher for project "systemone-client", owner systemonedev, repository
# systemone-builder, workflow release-client.yml, environment pypi.

on:
  push:
    tags: ["client-v*"]

# Read-only by default; only the publish job gets the OIDC token PyPI needs. Actions are pinned
# to commit SHAs (the comment names the tag) so a moved tag cannot change what runs here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#client-v}"
          toml=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('systemone/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$toml __init__=$init"
          test "$tag" = "$toml" && test "$tag" = "$init"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: clients/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The "pypi" environment requires a maintainer's approval before anything is uploaded.
    environment:
      name: pypi
      url: https://pypi.org/p/systemone-client
    permissions:
      id-token: write   # Trusted Publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
