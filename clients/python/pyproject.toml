[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone"
version = "0.1.0"
description = "Client for System One decision models (Kenning): typed questions in, calibrated typed answers out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.27"]
keywords = ["system one", "decision model", "kenning", "calibration", "classification"]
authors = [{ name = "Jesus Rodriguez" }, { name = "SystemOne Builder contributors" }]

[project.urls]
Homepage = "https://systemone.dev"
Source = "https://github.com/systemonedev/systemone-builder"
Models = "https://huggingface.co/systemonedev"

[project.optional-dependencies]
# run an exported Kenning bundle in-process, without a server
local = ["torch>=2.2", "transformers>=4.48", "safetensors"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["systemone*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
